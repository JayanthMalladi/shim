name: CI
on: push
jobs:
  current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
  lts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
  matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ['lts/*', 'latest']
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
